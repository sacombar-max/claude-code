name: Monitor Diario de Medios

#on:
  # Ejecuta de lunes a viernes a las 6:30 AM hora Colombia (UTC-5 = 11:30 UTC)
 # schedule:
  #  - cron: "30 11 * * 1-5"

  # Permite ejecutarlo manualmente desde GitHub con un clic
  # workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necesario para subir el informe al repo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor y generar informe
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT:     ${{ secrets.GMAIL_RECIPIENT }}
        run: python media_monitor.py

      - name: Subir informe al repositorio
        run: |
          git config user.name  "Monitor Bot"
          git config user.email "monitor-bot@noreply"
          git add reports/
          git diff --cached --quiet || git commit -m "Informe diario $(date +'%Y-%m-%d')"
          git push
